<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vaciar lista de invitados</title>
  <style>
    body { font-family: sans-serif; max-width: 520px; margin: 48px auto; padding: 0 20px; text-align: center; color: #5A2C70; }
    h1 { font-size: 22px; }
    p { font-size: 14px; line-height: 1.5; color: #444; }
    code { background: #EFE1F7; padding: 2px 6px; border-radius: 6px; }
    button { padding: 14px 30px; border: 0; border-radius: 999px; background: linear-gradient(135deg, #C58BE0, #8A3FB5); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 12px; }
    button:disabled { opacity: 0.5; cursor: default; }
    #msg { margin-top: 18px; font-weight: 700; font-size: 14px; }
    .ok { color: #1b7a3d; }
    .err { color: #C53030; }
  </style>
</head>
<body>
  <h1>Vaciar lista de invitados</h1>
  <p>Este botón elimina <b>todos</b> los nombres guardados en la colección <code>invitados</code> de tu base de datos (proyecto <code>lista-cumpleanos</code>).</p>
  <button id="btn" type="button">Vaciar la lista</button>
  <p id="msg" aria-live="polite"></p>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB5WY4CGBwhLA1uuSM6dyb2u8Wz-003p1g",
      authDomain: "lista-cumpleanos.firebaseapp.com",
      projectId: "lista-cumpleanos",
      storageBucket: "lista-cumpleanos.firebasestorage.app",
      messagingSenderId: "778574051201",
      appId: "1:778574051201:web:79420e428c9ca658b55a80"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const btn = document.getElementById("btn");
    const msg = document.getElementById("msg");

    btn.addEventListener("click", async () => {
      btn.disabled = true;
      msg.className = "";
      msg.textContent = "Eliminando...";
      try {
        const coleccion = db.collection("invitados");
        const snap = await coleccion.get();
        const borrados = [];
        snap.forEach((doc) => borrados.push(doc.ref.delete()));
        await Promise.all(borrados);
        msg.className = "ok";
        msg.textContent = "Lista vaciada (" + borrados.length + " invitados eliminados).";
        btn.disabled = false;
      } catch (e) {
        console.error(e);
        msg.className = "err";
        msg.textContent = "Error: revisa que Firestore esté activo y que las reglas permitan escritura.";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
